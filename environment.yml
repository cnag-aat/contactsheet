# Conda environment for contactsheet / .sbatch / contactsheet-plot
#
#   install.sh [ENV_PREFIX]   # creates the env AND installs the scripts into it
#   (or plain: conda env create -f environment.yml -- scripts then not on PATH)
#   conda activate contactsheet
#
# On Apple Silicon, bioconda lacks native builds for some of these; use
#   CONDA_SUBDIR=osx-64 conda env create -f environment.yml
name: contactsheet
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10,<3.13
  # mapping
  - chromap >=0.2.6
  - samtools >=1.17          # faidx -> chromsizes
  - htslib >=1.17            # bgzip
  - pigz
  # cooler / mcool
  - cooler >=0.9.3
  - cooltools >=0.6          # not required by the pipeline; handy for downstream analysis
  # pretext
  - pretextmap >=0.1.9
  - pretextsnapshot >=0.0.4
  # plotting
  - numpy
  - scipy
  - matplotlib-base >=3.7
